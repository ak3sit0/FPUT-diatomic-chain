# Plot config for plot_heatmap_grid.jl (periodic, linear color scale)
# Usage: julia --project=. examples/plot_heatmap_grid.jl configs/plot_heatmap_alpha_periodic_linear.toml

[data]
input_file = "results/data/modal_energies/springs_alpha_periodic_delta_k_00103/modal_energies_springs_alpha_periodic_2026-02-06.jld2"

[plot]
t_min          = 1.0
t_max          = 1.0e18   # use a very large number to mean "no upper limit"
time_subsample = 1       # keep every n-th time step (1 = all)
max_delta_cols = 3       # limit number of columns; use a large number for all
color_scale    = "linear"   # "log" or "linear"

[output]
heatmaps_dir = "results/figures/heatmaps"
