[experiment]
name        = "alpha_optical_N64_periodic"
description = """
α-FPUT diatomic chain, N=64, periodic BC.
Initial excitation on the lowest optical mode (mode N/2+1 = 33).
ΔK sweep: from fully diatomic (ΔK=0.9) to monatomic limit (ΔK=0.0).
"""

[physics]
N                 = 64
boundary          = "periodic"
system_type       = "springs"
nonlinear         = "alpha"
param_values      = [0.1]
delta_values      = [0.0, 0.01, 0.1, 0.12, 0.15, 0.17, 0.2, 0.3, 0.6, 0.8, 0.9]
initial_condition = "high"    # ignored when init_mode is set explicitly
init_mode         = 33        # lowest optical mode = N/2+1 = 33 for N=64
initial_energy    = 0.45

[simulation]
TMAX       = 1e8
T_block    = 1e6
DT         = 0.05
save_every = 1000
downsample = 2
debug      = false

[output]
base_dir = "results/raw"
