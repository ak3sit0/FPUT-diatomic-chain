[experiment]
name        = "alpha_sweep_stage2_direct"
description = "Stage 2: direct measurement of T_eq at the production point alpha=0.1, to close the loop against the Stage 1 extrapolation. Having both the exponent and the direct point, and showing they agree, is a stronger claim than either alone."

[physics]
N              = 64
boundary       = "fixed"
system_type    = "springs"
nonlinear      = "alpha"
param_values   = [0.1]
delta_values   = [0.2, 0.5]
init_type      = "band_ensemble"
branch         = "acoustic"
k_band_start   = 1
k_band_end     = 6
# n_real=30 here, not 15 as in Stage 1. This is the point where thermalization
# is *not* guaranteed within the window: the cheap check (window 2e5) had only
# 1/5 realizations cross xi=1/2. If frac_therm < 1 the median is censored, and
# censoring biases far more than ensemble noise does. 30 = 2 batches of ppn=15,
# so it costs 2x wall - paid deliberately on the one point that matters most.
n_real         = 30
seed_base      = 42
energy_density = 0.00695

[simulation]
# 1e6 cycles: the cheap check saw a crossing at 1.23e5 for Delta_kappa=0.2, and
# the Stage 1 fit extrapolates to ~2.2e5 here. 1e6 gives ~4x over that, enough
# margin for Delta_kappa=0.5 (~2.4x slower) to also cross rather than censor.
scaled_t_max  = 1.0e6
n_samples     = 3000
DT            = 0.2
n_blocks      = 40
entropy_delta = 0.6667
debug         = false

[output]
base_dir = "results/data/alpha_sweep"
