[experiment]
name        = "alpha_mode2_step0b"
description = "Step 0 (referee: robustness of the Delta_kappa=1/2 isolation threshold vs energy density): above-threshold Delta_kappa at the alphas where batch A showed open sub-threshold channels"

[physics]
N              = 64
boundary       = "periodic"
system_type    = "springs"
nonlinear      = "alpha"
# Dynamics depends only on alpha^2*eps (verified 2026-09-18, dS < 3e-7), so an
# alpha sweep at fixed eps is a lambda_bar sweep. alpha=0.1 is the nsweep_N64 job.
param_values   = [0.3]
delta_values   = [0.05, 0.2]
energy_density = 0.00695
init_type      = "mode"
init_mode      = 2
n_real         = 1
seed_base      = 42

[simulation]
scaled_t_max  = 1.0e5
n_samples     = 4000
n_blocks      = 20
DT            = 0.2
downsample    = 1
entropy_delta = 0.6
debug         = false

[output]
base_dir = "results/data/alpha_mode2/step0b_lowdelta"
