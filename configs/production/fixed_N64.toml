[experiment]
name = "fixed_N64_production"
description = "Fixed BC, N=64, α-spring nonlinearity, production run"

[physics]
N = 64
boundary = "fixed"
system_type = "springs"
nonlinear = "alpha"
param_values = [0.1]
delta_values = [0.05, 0.1, 0.2, 0.3, 0.5, 0.7]
initial_condition = "mode"
init_mode = 1 # fixed BC: mode 1 is the lowest acoustic mode (no k=0 zero mode as in periodic)
initial_energy = 0.445 # Initial density energy = 0.445/N

[simulation]
TMAX = 1e7
T_block = 1e6
DT = 0.05
save_every = 1000
downsample = 1
debug = false

[output]
base_dir = "results/data"