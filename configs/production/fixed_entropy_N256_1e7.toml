[experiment]
name        = "fixed_entropy_N256_1e7"
description = "Regime-1 entropy figure extended to 1e7 cycles at N=256: FBC, first-mode excitation, alpha=0.1, epsilon=0.00695, Delta_kappa = 0.05, 0.1, 0.5, 0.65, dt=0.2, 40000 samples (one every 250 cycles; the first 1e6 cycles are the same deterministic trajectory already stored in the 1e6 runs)."

[physics]
N              = 256
boundary       = "fixed"
system_type    = "springs"
nonlinear      = "alpha"
param_values   = [0.1]
delta_values   = [0.05, 0.1, 0.5, 0.65] 
energy_density = 0.00695     # E_total = eps*N, same density as the N=64 reference
init_type      = "mode"
init_mode      = 1           # fixed BC: mode 1 is the lowest acoustic mode
n_real         = 1
seed_base      = 42

[simulation]
# Fixed number of cycles => TMAX ∝ N. The N=64 reference spans scaled_t = 5.5e4-7.7e4
# (fixed TMAX=1e7, so it shrinks with Delta_kappa); 1e5 covers it for every Delta_kappa.
scaled_t_max  = 1.0e7
# 40000 samples = one every 2.5 cycles: the paper's figure starts near t ~ 1e1 on a
# log axis and reads the relaxation at t ~ 1e2, so 4000 samples (25 cycles apart)
# would leave 4 points in that decade. modal_E ~ 40000*N*8 B per case.
n_samples     = 40000
n_blocks      = 40
DT            = 0.2          # w_max*dt = 0.4; validated against DT=0.05 on this case
downsample    = 1
entropy_delta = 0.6
debug         = false

[output]
base_dir = "results/data/fixed_entropy_N256_1e7"
