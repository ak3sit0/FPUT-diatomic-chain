[experiment]
name        = "alpha_sweep_stage1"
description = "Stage 1 of the lambda-bar sweep: T_eq(alpha) at fixed eps=0.00695, for the resonant gap (Delta_kappa=0.2) and the frozen control (0.5). Six alphas spanning ~2.7 decades in T_eq, chosen from a measured probe rather than from the falsified alpha^-4 extrapolation."

[physics]
N              = 64
boundary       = "fixed"
system_type    = "springs"
nonlinear      = "alpha"
# lambda_bar = alpha*sqrt(eps). Sweeping alpha at fixed eps keeps the initial
# condition literally identical in phase space across cases, so any difference
# in xi(t) is unambiguously the coupling, not a changed xi_0 or spectrum.
#
# Grid chosen from a measured probe (n_real=3, Delta_kappa=0.2), NOT from the
# alpha^-4 extrapolation, which this probe falsified:
#   alpha  0.20   0.30   0.45   0.60   0.80
#   T_th   7090    533   53.3   13.3    4.5   cycles
# The local exponent d(lnT)/d(ln lambda_bar) drifts from -6.4 at alpha=0.20 to
# -3.8 at alpha=0.80, so the range picked *is* the result: alpha >= 0.8 sits on
# the flat end and would report ~-4 (four-wave) as an artifact of the range.
# alpha=0.15 did not thermalize within 2e4 cycles; it is the lower edge here.
param_values   = [0.2, 0.25, 0.3, 0.375, 0.45, 0.6]
delta_values   = [0.2, 0.5]
init_type      = "band_ensemble"
branch         = "acoustic"
k_band_start   = 1
k_band_end     = 6
# n_real=15 gives SE(ln median T_th) = 0.163 (measured sigma_lnT = 0.503), which
# propagates to +/-0.17 on the fitted exponent. The exponent's drift across the
# grid is 2.6, ~15x larger, so ensemble noise is not the limiting uncertainty
# and doubling n_real would buy nothing interpretable. Also = ppn, so one batch.
n_real         = 15
seed_base      = 42
energy_density = 0.00695

[simulation]
# 1e5 cycles is ~14x the slowest measured point (alpha=0.2 -> 7090). The margin
# covers Delta_kappa=0.5, which the probe showed runs ~2.4x slower than 0.2.
scaled_t_max  = 1.0e5
n_samples     = 3000
DT            = 0.2
n_blocks      = 40
entropy_delta = 0.6667
debug         = false

[output]
base_dir = "results/data/alpha_sweep"
