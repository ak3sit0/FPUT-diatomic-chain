# Plot fixed point: periodic optical fixed-alpha data with selected deltas

[data]
input_file = "results/raw/alpha_optical_N64_periodic/results_springs_alpha_periodic_2026-03-06.jld2"

[plot]
t_min          = 1e-3
t_max          = 1.0e18
time_subsample = 1
max_delta_cols = 3
color_scale    = "log"

[filter]
delta_values = [0.01, 0.1, 0.2]

[output]
heatmaps_dir = "results/figures/heatmaps"
