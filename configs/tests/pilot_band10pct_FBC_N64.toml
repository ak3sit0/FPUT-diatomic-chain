[experiment]
name        = "pilot_band10pct_FBC_N64"
description = "Replicate Wang et al. 2020/2024 protocol: excite the lowest 10% of modes (band_ensemble), fixed boundary conditions, to test the universal T_eq ~ eps^(2-n) scaling instead of single-mode PBC excitation"

[physics]
N             = 64
boundary      = "fixed"
system_type   = "springs"
nonlinear     = "alpha"
param_values  = [0.1]
delta_values  = [0.05, 0.1, 0.2, 0.3, 0.5, 0.7]
init_type     = "band_ensemble"
branch        = "acoustic"
k_band_start  = 1
k_band_end    = 6
n_real        = 10
seed_base     = 42
energy_density = 0.00695

[simulation]
scaled_t_max = 5.0e4
n_samples    = 3000
DT           = 0.2
n_blocks     = 40
entropy_delta = 0.6667
debug        = false

[output]
base_dir = "results/data/tests"
