[experiment]
name        = "pilot_band10pct_FBC_N64_dk02_check"
description = "Cheap check: does the log-law T_eq extrapolation for Delta_kappa=0.2 (band-10% FBC) survive a 4x longer window? Single delta, reduced n_real for a fast qualitative answer before committing to the full 2e5 sweep."

[physics]
N             = 64
boundary      = "fixed"
system_type   = "springs"
nonlinear     = "alpha"
param_values  = [0.1]
delta_values  = [0.2]
init_type     = "band_ensemble"
branch        = "acoustic"
k_band_start  = 1
k_band_end    = 6
n_real        = 5
seed_base     = 42
energy_density = 0.00695

[simulation]
scaled_t_max = 2.0e5
n_samples    = 3000
DT           = 0.2
n_blocks     = 40
entropy_delta = 0.6667
debug        = false

[output]
base_dir = "results/data/tests"
