[experiment]
name        = "ensemble_production"
description = "Producción: ensamble de fases, barrido Δκ completo (0.1-0.5), n_real=8"

[physics]
N             = 64
boundary      = "periodic"
system_type   = "springs"
nonlinear     = "alpha"
param_values  = [0.1]
delta_values  = [0.1, 0.15, 0.2, 0.3, 0.4, 0.5]
energy_density = 0.445
init_type     = "band_ensemble"
branch        = "acoustic"
n_real        = 8
seed_base     = 42

[simulation]
TMAX          = 1e8
T_block       = 1e6
DT            = 0.05
save_every    = 10000
downsample    = 1
entropy_delta = 0.6
debug         = false

[output]
base_dir = "results/data/ensemble_production"
