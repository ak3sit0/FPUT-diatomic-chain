[experiment]
name        = "nsweep_test_quick"
description = "Test local: modo 2, N=[16,32, 64], TMAX=1e7"

[physics]
N_values       = [16, 32, 64, 128]
boundary       = "periodic"
system_type    = "springs"
nonlinear      = "alpha"
param_values   = [0.1]
delta_values   = [0.1]
energy_density = 0.445
init_type      = "mode"
n_real         = 1
seed_base      = 42

[simulation]
TMAX          = 1e7
T_block       = 1e6
DT            = 0.05
save_every    = 500
downsample    = 1
entropy_delta = 0.6
debug         = true

[output]
base_dir = "results/data/nsweep_test"
