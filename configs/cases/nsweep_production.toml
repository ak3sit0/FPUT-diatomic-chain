[experiment]
name        = "nsweep_production"
description = "Barrido N modo 2: alpha=0.1, Dk=0.1, TMAX=1e7"

[physics]
N_values       = [32, 64, 128, 256]
boundary       = "periodic"
system_type    = "springs"
nonlinear      = "alpha"
param_values   = [0.1]
delta_values   = [0.1]

# ⚠ OJO: el significado de esta línea CAMBIÓ. Leer antes de relanzar.
#
#   Antes (bug en compute_ensemble_Nsweep.jl:158, ya corregido):
#     E_total = energy_density · first(N_values) = 0.445·32 = 14.24  para TODAS las N
#     ⇒ ε = E_total/N caía como 1/N: 0.445 / 0.222 / 0.111 / 0.056 en N=32/64/128/256.
#        El barrido en N NO estaba controlado en densidad de energía.
#
#   Ahora: E_total = energy_density · N  ⇒  ε = 0.445 fija para todas las N.
#
# Es decir, relanzar este config TAL CUAL ya no reproduce los .jld2 antiguos, y además
# pone el sistema en un régimen 64× más denso que el de las figuras del paper
# (que usan E_total=0.445, o sea ε=0.00695 en N=64). Con ε=0.445 el sistema termaliza
# del todo y la banda óptica se llena; con ε=0.00695 no.
#
# Para el régimen de las figuras del paper: energy_density = 0.00695
# Ver configs/cases/nsweep_rise_N256.toml y GUIA_NSWEEP_RISE.md
energy_density = 0.445

init_type      = "mode"
n_real         = 1
seed_base      = 42

[simulation]
TMAX          = 1e7
T_block       = 5e5
DT            = 0.05
save_every    = 1000
downsample    = 1
entropy_delta = 0.6

[output]
base_dir = "results/data/nsweep_production"
