[experiment]
name        = "nsweep_rise_N256"
description = """
¿Persiste para N>64 la subida parcial de entropía observada en N=64 a scaled_t ~1e3-1e5?

Referencia (sweep_results_2026-07-02_periodic_case.jld2, N=64, E_total=0.445, ε=0.00695):
  Δκ=0.10  S/logN: 0.342 → 0.358 → 0.479  (scaled_t 1e3 → 1e4 → 6e4)
  Δκ=0.20  S/logN: 0.379 → 0.417 → 0.475
  Δκ=0.05, 0.30 planas en ~0.33  → la subida es específica de Δκ≈0.1-0.2
  E_opt/E ≈ 0 en TODOS los Δκ → la banda óptica no se llena; la subida es
  redistribución DENTRO de la banda acústica, no transferencia interbanda.
  Nada alcanza equipartición (S/logN ≤ 0.48), así que el observable es la ALTURA y el
  INSTANTE de la subida parcial, no un cruce de umbral alto.

Control del barrido:
  - ε FIJA en 0.00695 (= 0.445/64, la del run de referencia) ⇒ E_total = ε·N.
    Fijar E_total en su lugar haría caer ε como 1/N y los sistemas grandes serían
    progresivamente más lineales: la subida se debilitaría por eso y no por tamaño finito.
  - scaled_t_max FIJO: scaled_t = t·ω₂/2π con ω₂ ∝ 1/N ⇒ TMAX ∝ N. Con TMAX fijo,
    N=256 apenas llega a scaled_t≈3.9e4 y cortaría la subida por la mitad.
  - n_samples FIJO ⇒ nt constante ⇒ modal_E ∝ N (no ∝ N²).

Δκ=0.05 y 0.30 son controles planos: deben seguir planos al crecer N. Si aparece subida
en ellos, el efecto no es el de la referencia.
"""

[physics]
N_values       = [64, 128, 256]
boundary       = "periodic"
system_type    = "springs"
nonlinear      = "alpha"
param_values   = [0.1]
delta_values   = [0.05, 0.1, 0.2, 0.3]   # 0.1/0.2 = señal; 0.05/0.3 = control plano
energy_density = 0.00695                 # = 0.445/64, la ε del run de referencia N=64
init_type      = "mode"
n_real         = 1
seed_base      = 42

[simulation]
scaled_t_max  = 1.0e6   # saturación del paquete; asequible tras el 6.3x (kernel + dt)
n_samples     = 4000    # ⇒ save_every derivado; modal_E ≈ 2/4/8 MB por caso
n_blocks      = 20
DT            = 0.2    # 4.2x vs 0.05; w_max*dt=0.4, |dE|/E=1.3e-11, exp(S) difiere 0.13%
downsample    = 1
entropy_delta = 0.6
debug         = false

[output]
base_dir = "results/data/nsweep_rise"
