# Plot config for plot_entropy_data.jl
# Usage: julia --project=. examples/plot_entropy_data.jl configs/plot_entropy_alpha_periodic.toml

[data]
# Path to the .jld2 results file produced by compute_modal_energies.jl
input_file = "results/data/modal_energies/16-02-2026/modal_energies_springs_alpha_periodic_2026-02-16.jld2"

[analysis]
smooth_delta = 0.6    # time-averaging window for entropy / ξ computation

[output]
entropy_dir = "results/figures/entropy"
xi_dir      = "results/figures/xi"
