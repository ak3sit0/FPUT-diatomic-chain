# Plot config for the short fixed-acoustic run (mode 1 initial). 
# Usage: julia --project=. examples/plot_heatmap_grid.jl configs/plot_heatmap_fixed_short.toml

[data]
input_file = "results/raw/fixed_acoustic_alpha_short/results_springs_alpha_fixed_2026-03-16.jld2"

[plot]
t_min          = 0.001
t_max          = 1.0e18
time_subsample = 1
max_delta_cols = 3
color_scale    = "linear"

[output]
heatmaps_dir = "results/figures/heatmaps"
