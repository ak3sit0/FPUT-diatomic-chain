[experiment]
name        = "alpha_sweep_N_periodic"
description = "α-FPUT periodic BC, delta=0.1 (transición), N variable (32..512)" 

[physics]
N                 = 64
boundary          = "periodic"
system_type       = "springs"
nonlinear         = "alpha"
param_values      = [0.1]
delta_values      = [0.1]  # where the transition happens
initial_condition = "low"
init_mode         = 2
initial_energy    = 0.45

[simulation]
TMAX       = 1e7
T_block    = 1e6
DT         = 0.05
save_every = 1000
downsample = 2
debug      = false

[output]
base_dir = "results/raw"
