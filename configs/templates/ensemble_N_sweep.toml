[experiment]
name        = "ensemble_N_sweep"
description = "Barrido multi-N del ensamble de fases: Δκ completo, n_real=50"

[physics]
N_values       = [32, 64, 128, 256]
boundary       = "periodic"
system_type    = "springs"
nonlinear      = "alpha"
param_values   = [0.1]
delta_values   = [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5]
energy_density = 0.445
init_type      = "band_ensemble"
branch         = "acoustic"
n_real         = 50
seed_base      = 42

[simulation]
TMAX          = 1e6
T_block       = 5e4
DT            = 0.05
save_every    = 100
downsample    = 1
entropy_delta = 0.6

[output]
base_dir = "results/data/ensemble_N_sweep"
