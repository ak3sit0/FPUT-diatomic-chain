# Master plotting config template

[data]
# input_file: single .jld2 file, directory of .jld2 files, or pattern with *
input_file = "results/raw/alpha_sweep_N_periodic/results_springs_alpha_periodic_2026-04-03_N64.jld2"

[analysis]
smooth_delta = 0.6
normalize_by_logN = false

[output]
outdir_entropy = "results/figures/entropy"
outdir_xi = "results/figures/xi"
outdir_heatmaps = "results/figures/heatmaps"

[plot]
# plot-level options
t_min = 0.0
t_max = 1e18
time_subsample = 1
color_scale = "log"

# Filters (empty = include all)
[filter]
param_values = []
delta_values = []

[heatmap]
# Colormap as array of hex colors or named colors
colormap = ["#FFFFFF", "#B2D9FF", "#5999F2", "#3359CC", "#0D4CB3"]
clamp_min = 1e-6
clamp_max = 1.0
px_per_unit = 2
font = "Times New Roman"
titlesize = 35
labelsize = 45
ticksize = 30
cell_w = 600
cell_h = 500
margin_w = 200
margin_h = 150
gap = 38
colorbar = true
scale = "log" # or "linear"
# Apply log-scale color mapping by default and an explicit normalization toggle
color_normalize = "log10" # options: "log10", "linear", "none"
normalize_by_max = false    # if true, divide data by its max before mapping
