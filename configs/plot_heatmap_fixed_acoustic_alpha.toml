# Plot config for fixed_acoustic_alpha (full dataset), same style as periodic version

[data]
input_file = "results/raw/fixed_acoustic_alpha/results_springs_alpha_fixed_2026-03-16.jld2"

[plot]
t_min          = 1.0
t_max          = 1.0e18
time_subsample = 1
max_delta_cols = 3
color_scale    = "log"

[output]
heatmaps_dir = "results/figures/heatmaps"
