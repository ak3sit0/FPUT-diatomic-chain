[experiment]
name        = "test_quick"
description = "Minimal smoke test — delete after verification"

[physics]
N                 = 8
boundary          = "periodic"
system_type       = "springs"
nonlinear         = "alpha"
param_values      = [0.1]
delta_values      = [0.103]
initial_condition = "low"
initial_energy    = 0.45

[simulation]
TMAX       = 10.0
T_block    = 5.0
DT         = 0.05
save_every = 1
downsample = 1
debug      = false

[output]
base_dir = "results/raw"
