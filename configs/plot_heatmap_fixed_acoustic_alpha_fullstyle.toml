# Plot config for fixed_acoustic_alpha (full TMAX=1e8, same style as periodic) 

[data]
input_file = "results/raw/fixed_acoustic_alpha/results_springs_alpha_fixed_2026-03-16.jld2"

[plot]
t_min          = 1e-3
t_max          = 1.0e18
time_subsample = 1
max_delta_cols = 11
color_scale    = "log"

[filter]
delta_values = [0.01, 0.1, 0.2]

[output]
heatmaps_dir = "results/figures/heatmaps"
