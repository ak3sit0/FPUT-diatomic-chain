[physics]
param_values = [0.1]
system_type = "springs"
boundary = "periodic"
seed_base = 42
N = 256
nonlinear = "alpha"
delta_values = [0.05, 0.1, 0.2, 0.3]
energy_density = 0.00695
n_real = 1
N_values = [256]
init_type = "mode"

[output]
base_dir = "results/data/nsweep_rise_N256"

[experiment]
name = "nsweep_rise_N256"
description = """¿Persiste para N>64 la subida parcial de entropía observada en N=64 a scaled_t ~1e3-1e5?\n\nReferencia (sweep_results_2026-07-02_periodic_case.jld2, N=64, E_total=0.445, ε=0.00695):\n  Δκ=0.10  S/logN: 0.342 → 0.358 → 0.479  (scaled_t 1e3 → 1e4 → 6e4)\n  Δκ=0.20  S/logN: 0.379 → 0.417 → 0.475\n  Δκ=0.05, 0.30 planas en ~0.33  → la subida es específica de Δκ≈0.1-0.2\n  E_opt/E ≈ 0 en TODOS los Δκ → la banda óptica no se llena; la subida es\n  redistribución DENTRO de la banda acústica, no transferencia interbanda.\n  Nada alcanza equipartición (S/logN ≤ 0.48), así que el observable es la ALTURA y el\n  INSTANTE de la subida parcial, no un cruce de umbral alto.\n\nControl del barrido:\n  - ε FIJA en 0.00695 (= 0.445/64, la del run de referencia) ⇒ E_total = ε·N.\n    Fijar E_total en su lugar haría caer ε como 1/N y los sistemas grandes serían\n    progresivamente más lineales: la subida se debilitaría por eso y no por tamaño finito.\n  - scaled_t_max FIJO: scaled_t = t·ω₂/2π con ω₂ ∝ 1/N ⇒ TMAX ∝ N. Con TMAX fijo,\n    N=256 apenas llega a scaled_t≈3.9e4 y cortaría la subida por la mitad.\n  - n_samples FIJO ⇒ nt constante ⇒ modal_E ∝ N (no ∝ N²).\n\nΔκ=0.05 y 0.30 son controles planos: deben seguir planos al crecer N. Si aparece subida\nen ellos, el efecto no es el de la referencia.\n"""

[simulation]
downsample = 1
entropy_delta = 0.6
n_samples = 4000
DT = 0.2
n_blocks = 20
scaled_t_max = 1.0e6
debug = false
